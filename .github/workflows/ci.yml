# Builds the macOS app and starts it, and starts the Android app in an emulator, on every push to
# main that touches them. Neither can be done on the Windows PC the app is developed on, so this is
# where the Mac code is compiled and where both are first run.
#
# Each job leaves its output (build log, a screenshot, crash reports) on a branch of its own —
# ci-logs-mac, ci-logs-android — replaced on every run, so the result can be read with plain git.
name: CI

on:
  push:
    branches: [main]
    paths: ['mac/**', 'android/**', 'src/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          sw_vers > "$RUNNER_TEMP/out/system.txt"; swiftc --version >> "$RUNNER_TEMP/out/system.txt" 2>&1
          set -o pipefail
          (cd mac && UNIVERSAL=1 DMG=1 ./build.sh) 2>&1 | tee "$RUNNER_TEMP/out/build.log"
      - name: Start it
        run: |
          out="$RUNNER_TEMP/out"
          open mac/build/photos.jpeg.app
          sleep 25
          screencapture -x "$out/screen.png" || true
          if pgrep -x photosjpeg > /dev/null; then echo "running after 25 s" > "$out/run.txt"; else echo "NOT running after 25 s" > "$out/run.txt"; fi
          ls -la "$HOME/Library/Application Support/photos.jpeg" >> "$out/run.txt" 2>&1 || true
          log show --last 2m --predicate 'process == "photosjpeg"' --style compact 2>/dev/null | tail -150 > "$out/applog.txt" || true
          cp "$HOME"/Library/Logs/DiagnosticReports/photosjpeg* "$out/" 2>/dev/null || true
          pkill -x photosjpeg || true
          grep -q '^running' "$out/run.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/photos.jpeg.dmg
      - name: Leave the output on a branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" && echo "$GITHUB_SHA" > commit.txt
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "mac $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-mac

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Let the emulator use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start it in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/ci-smoke.sh "${{ runner.temp }}/out"
      - name: Leave the output on a branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out" && echo "$GITHUB_SHA" > commit.txt
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "android $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-android
