# Builds the Windows installers and the Android app when a version tag (v2.1.0, …) is pushed, and
# publishes them as a GitHub release. Can also be run by hand from the Actions tab (it then only
# builds and keeps the files as workflow artifacts; nothing is published).
#
# Nothing here is signed: the Setup programs are unsigned (Windows SmartScreen will say so), the
# Android app is a debug build, and the Store package is the one to upload in Partner Center, which
# signs it. The macOS app needs a Mac and is not built here.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Installer
        shell: pwsh
        run: ./windows/build.ps1 -Installer
      - name: Store package
        shell: pwsh
        run: ./windows/package-store.ps1 -NoBuild
      - name: Lite installer (models are downloaded on first use)
        shell: pwsh
        run: ./windows/build.ps1 -Installer -Lite
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            windows/build/*.exe
            windows/build/*.msix
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "photos.jpeg-${GITHUB_REF_NAME#v}-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: photos.jpeg-*-android-debug.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes (this version's section of CHANGELOG.md)
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## $v" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "photos.jpeg $v" > notes.md
          printf '\n\nThe Setup programs are not code-signed, so Windows SmartScreen asks before running them. The `-lite` Setup leaves the neural-network models out and downloads each the first time a feature needs it. The `.msix` is the Microsoft Store package (unsigned; it cannot be installed by double-click). The Android file is a debug build.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
