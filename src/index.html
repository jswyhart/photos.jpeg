<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline' app:; font-src 'self' app: data:; script-src 'self' app:; worker-src 'self' app: blob:; connect-src 'self' app: data: blob:; media-src 'self' app: blob: data:">
  <title>photos.jpeg</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><div class="logo"><i class="fa-solid fa-camera-retro"></i></div><span>photos<span class="ext">.jpeg</span></span></div>
      <div id="activity" class="no-drag"><span id="activity-text"></span><div class="bar hidden" id="activity-bar"><i></i></div></div>
      <nav class="modules">
        <button data-module="library" class="on">Library</button>
        <span class="divider">|</span>
        <button data-module="develop">Develop</button>
        <span class="divider">|</span>
        <button data-module="map">Map</button>
      </nav>
    </header>

    <div id="main">
      <aside id="left"></aside>
      <section id="center">
        <div class="toolbar" id="toolbar-top"></div>
        <div id="stage">
          <div id="library-view" class="grid"></div>
          <div id="viewer" class="hidden"></div>
          <div id="empty" class="empty hidden"></div>
        </div>
        <div class="toolbar bottom" id="toolbar-bottom"></div>
      </section>
      <aside id="right"></aside>
    </div>

    <footer id="filmstrip">
      <div class="fh" id="film-head"></div>
      <div class="fs" id="film-strip"></div>
    </footer>
  </div>

  <div id="drop" class="hidden"><div class="card"><i class="fa-solid fa-cloud-arrow-up"></i><p>Drop photos, RAW files or folders to import</p><span class="muted">JPEG · PNG · WebP · AVIF · TIFF · NEF · CR2 · CR3 · ARW · DNG · RAF · ORF · RW2 · GPR …</span></div></div>
  <div id="toast"><i class="fa-solid fa-circle-check"></i><span id="toast-msg"></span></div>

  <script src="js/pipeline.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/decode.js"></script>
  <script src="js/raw.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/xmp.js"></script>
  <script src="js/luts.js"></script>
  <script src="js/virtual.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/lens.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/develop.js"></script>
  <script src="js/map.js"></script>
  <script src="js/dupes.js"></script>
  <script src="js/library.js"></script>
  <script src="js/icc.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/video/mp4.js"></script>
  <script src="js/video/gl.js"></script>
  <script src="js/video/cdng.js"></script>
  <script src="js/video/video.js"></script>
  <script src="js/video/transport.js"></script>
  <script src="js/video/vexport.js"></script>
  <script src="js/video/keyframes.js"></script>
  <script src="js/video/stabilize.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
