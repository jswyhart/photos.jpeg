# Optional: generate an Xcode project with XcodeGen (brew install xcodegen; xcodegen generate)
name: photos.jpeg
options:
  bundleIdPrefix: app.photosjpeg
  deploymentTarget:
    macOS: "12.0"
targets:
  photos.jpeg:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    entitlements:
      path: photos.jpeg.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.photosjpeg.mac
        PRODUCT_NAME: photos.jpeg
        EXECUTABLE_NAME: photosjpeg
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
    postCompileScripts:
      - name: Copy shared web app
        script: rsync -a --delete "${SRCROOT}/../src/" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/web/"
        basedOnDependencyAnalysis: false
